{% assign history = page.git_history %}
{% if history %}
<section class="page-history" aria-label="문서 편집 정보">
  <dl class="page-history__items">
    <div class="page-history__item">
      <dt>작성자</dt>
      <dd>{{ history.author | escape }}</dd>
    </div>
    <div class="page-history__item">
      <dt>최종 편집자</dt>
      <dd>{{ history.last_editor | escape }} · {{ history.last_modified | escape }}</dd>
    </div>
    <div class="page-history__item">
      <dt>기여자</dt>
      <dd>{{ history.contributors | join: ", " | escape }}</dd>
    </div>
  </dl>
  <a class="page-history__link" href="https://github.com/JBUH-skin-microbiome/lab-handbook/commits/main/{{ page.path }}" target="_blank" rel="noopener noreferrer">GitHub에서 변경 기록 보기</a>
</section>
{% endif %}

<p class="text-small text-grey-dk-100 mb-0">피부마이크로바이옴연구실</p>
