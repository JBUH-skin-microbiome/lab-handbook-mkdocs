<!-- Keep internal navigation on one deployment; preserve all native theme behavior. -->
<script>
  (function () {
    const revision = {{ site.time | date: '%s' | jsonify }};
    const handbookPath = {{ site.baseurl | append: '/' | jsonify }};
    document.addEventListener('DOMContentLoaded', function () {
      document.addEventListener('click', function (event) {
        const anchor = event.target.closest('a[href]');
        if (!anchor) return;
        const href = anchor.getAttribute('href');
        if (!href || href.startsWith('#')) return;
        const destination = new URL(href, window.location.href);
        if (destination.origin !== window.location.origin || !destination.pathname.startsWith(handbookPath)) return;
        if (!destination.pathname.endsWith('/') && !destination.pathname.endsWith('.html')) return;
        destination.searchParams.set('v', revision);
        anchor.href = destination.href;
      }, true);
    });
  })();
</script>

<script>
  (function () {
    const repository = 'JBUH-skin-microbiome/lab-handbook';

    function contributor(commit) {
      const name = commit.commit.author.name;
      const login = commit.author && commit.author.login;
      return {
        key: login || commit.commit.author.email || name,
        label: login ? `${name} (@${login})` : name
      };
    }

    document.addEventListener('DOMContentLoaded', async function () {
      const section = document.querySelector('[data-page-history]');
      if (!section) return;

      const path = section.dataset.pageHistory;
      const cacheKey = `lab-manual-history:${path}`;

      try {
        let commits;
        const cached = sessionStorage.getItem(cacheKey);
        if (cached) {
          commits = JSON.parse(cached);
        } else {
          const endpoint = `https://api.github.com/repos/${repository}/commits?path=${encodeURIComponent(path)}&per_page=100`;
          const response = await fetch(endpoint, {
            headers: { Accept: 'application/vnd.github+json' }
          });
          if (!response.ok) return;
          commits = await response.json();
          sessionStorage.setItem(cacheKey, JSON.stringify(commits));
        }

        if (!Array.isArray(commits) || commits.length === 0) return;

        const latest = commits[0];
        const first = commits[commits.length - 1];
        const names = [];
        const seen = new Set();

        [...commits].reverse().forEach(function (commit) {
          const person = contributor(commit);
          if (!seen.has(person.key)) {
            seen.add(person.key);
            names.push(person.label);
          }
        });

        section.querySelector('[data-history-author]').textContent = contributor(first).label;
        section.querySelector('[data-history-editor]').textContent = contributor(latest).label;
        section.querySelector('[data-history-date]').textContent = latest.commit.author.date.slice(0, 10);
        section.querySelector('[data-history-contributors]').textContent = names.join(', ');
        section.hidden = false;
      } catch (_) {
        section.hidden = true;
      }
    });
  })();
</script>

<style>
  .page-history {
    margin-top: 2.5rem;
    padding-top: 1rem;
    border-top: 1px solid #e5e7eb;
    color: #5c6470;
    font-size: 0.82rem;
    line-height: 1.65;
  }

  .page-history__items {
    display: flex;
    flex-wrap: wrap;
    gap: 0.25rem 1.25rem;
    margin: 0;
  }

  .page-history__item {
    display: flex;
    gap: 0.35rem;
    margin: 0;
  }

  .page-history dt {
    font-weight: 600;
    color: #343a40;
  }

  .page-history dd {
    margin: 0;
  }

  .page-history__link {
    display: inline-block;
    margin-top: 0.2rem;
  }
</style>
