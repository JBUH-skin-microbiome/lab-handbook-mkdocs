<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>JBSM Project Dashboard</title>
    <link rel="stylesheet" href="../css/pretendard.css">
    <link rel="stylesheet" href="../css/project-dashboard.css">
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 24px;
        background: #f7f8fc;
        color: #222;
        font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .dashboard-shell {
        width: min(1440px, 100%);
        margin: 0 auto;
      }
      .dashboard-header {
        margin-bottom: 20px;
      }
      .dashboard-header h1 {
        margin: 0 0 6px;
        color: #191970;
        font-size: clamp(1.55rem, 3vw, 2.25rem);
      }
      .dashboard-header p {
        margin: 0;
        color: #606474;
      }
      .project-dashboard {
        max-width: none;
      }
      @media (max-width: 720px) {
        body { padding: 14px; }
      }
    </style>
  </head>
  <body>
    <main class="dashboard-shell">
      <header class="dashboard-header">
        <h1>JBSM Project Dashboard</h1>
        <p>프로젝트와 업무 진행 상태를 검색하고 필터링할 수 있습니다.</p>
      </header>
      <div id="project-dashboard" class="project-dashboard" aria-live="polite">
        <p class="project-dashboard__loading">프로젝트 현황을 불러오는 중입니다.</p>
      </div>
    </main>
    <script src="../js/project-dashboard.js"></script>
  </body>
</html>
